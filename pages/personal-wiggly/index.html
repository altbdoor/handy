<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="last-modified" content="__LAST_DATE__" />

    <title>Personal wiggly</title>
    __FAVICON:🎨__
    <style>
      html {
        --base-size: 1030px;
      }

      body {
        margin: 0;
        position: relative;
        background-color: #000;
      }

      .container {
        display: flex;
        overflow: hidden;
      }

      .overlay {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: var(--base-size);
        height: 690px;
        transition: transform 0.2s ease;
        z-index: 100;
        pointer-events: none;
      }
      .overlay > div {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .overlay > div > div {
        --side-gap: 20px;
        position: absolute;
        top: 47px;
        left: 13px;
        width: calc(355px * 2);
        height: calc(261px * 2);
        z-index: 200;
        display: grid;
        grid-template-columns: var(--side-gap) repeat(3, 1fr) var(--side-gap);
        grid-template-rows: var(--side-gap) repeat(3, 1fr) var(--side-gap);
      }
      .overlay span {
        border-width: 0 0 1px 1px;
        border-style: dashed;
        border-color: red;
      }

      iframe {
        display: block;
        border: 0;
        width: var(--base-size);
        height: var(--base-size);
        transition: transform 0.2s ease;
        margin: 0 auto;
      }

      .controls {
        position: fixed;
        top: 50%;
        right: 0.5rem;
        z-index: 2000;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        transform: translateY(-50%);
      }

      .controls button {
        padding: 1rem;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="overlay"></div>
      <iframe src="./paint.html#main" frameborder="0" style="transform: rotate(0deg)"></iframe>
      <div class="controls">
        <button type="button" class="rotate" data-val="+90">Rotate R</button>
        <button type="button" class="rotate" data-val="-90">Rotate L</button>
      </div>
    </div>

    <script>
      const overlay = document.querySelector(".overlay");
      overlay.innerHTML = `
        <div>
          <div>${Array(25).fill("<span></span>").join("")}</div>
        </div>
      `;

      [...document.querySelectorAll(".rotate")].forEach((btn) => {
        btn.onclick = () => {
          const frame = document.querySelector("iframe");

          const styleRotate = frame.style.transform.replace(/[^0-9]/g, "");
          const styleRotateInt = parseInt(styleRotate, 10);

          const nextRotate = parseInt(btn.getAttribute("data-val"), 10);
          const rotateNext = styleRotateInt + nextRotate;
          frame.style.transform = `rotate(${rotateNext}deg)`;
          overlay.style.transform = `translate(-50%, -50%) rotate(${rotateNext}deg)`;
        };
      });
    </script>
  </body>
</html>
