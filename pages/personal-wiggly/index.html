<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="last-modified" content="__LAST_DATE__" />

    <title>Personal wiggly</title>
    __FAVICON:🎨__
    <style>
      body {
        margin: 0;
        position: relative;
        background-color: #000;
      }

      .container {
        display: flex;
        overflow: hidden;
      }

      iframe {
        display: block;
        border: 0;
        width: 1030px;
        height: 1030px;
        transition: transform 0.2s ease;
        margin: 0 auto;
      }

      .controls {
        position: fixed;
        top: 50%;
        right: 0.5rem;
        z-index: 2000;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        transform: translateY(-50%);
      }

      .controls button {
        padding: 1rem;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <iframe
        src="./paint.html#main"
        frameborder="0"
        style="transform: rotate(0deg)"
      ></iframe>
      <div class="controls">
        <button type="button" class="rotate" data-val="+90">Rotate R</button>
        <button type="button" class="rotate" data-val="-90">Rotate L</button>
      </div>
    </div>

    <script>
      [...document.querySelectorAll(".rotate")].forEach((btn) => {
        btn.onclick = () => {
          const frame = document.querySelector("iframe");
          const styleRotate = frame.style.transform.replace(/[^0-9]/g, "");
          const styleRotateInt = parseInt(styleRotate, 10);

          const nextRotate = parseInt(btn.getAttribute("data-val"), 10);
          const rotateNext = styleRotateInt + nextRotate;
          frame.style.transform = `rotate(${rotateNext}deg)`;
        };
      });
    </script>
  </body>
</html>
